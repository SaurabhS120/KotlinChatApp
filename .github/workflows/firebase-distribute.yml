name: Distribute CMP Android App to Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  distribute:
    runs-on: ubuntu-latest

    env:
      ANDROID_GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      TESTERS_GROUP: ${{ vars.TESTERS_GROUP }}

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "18"

      # --------------------------------------------------
      # Cache Gradle
      # --------------------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # --------------------------------------------------
      # Create google-services.json for CMP Android
      # --------------------------------------------------
      - name: Create Google Services file
        run: |
          echo "$ANDROID_GOOGLE_SERVICES" | base64 --decode > composeApp/GoogleService-Info.plist

      # --------------------------------------------------
      # Gradle Build (shared module + android app)
      # --------------------------------------------------
      - name: Build CMP Android release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleRelease

      # --------------------------------------------------
      # Install Firebase CLI
      # --------------------------------------------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # --------------------------------------------------
      # Distribute APK to Firebase App Distribution
      # --------------------------------------------------
      - name: Distribute to Firebase
        run: |
          firebase appdistribution:distribute \
            composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTERS_GROUP" \
            --release-notes "$(cat release_notes.txt)"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
